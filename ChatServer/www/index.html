<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070d" />
  <title>AI聊天助手</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app">
    <!-- ================= 左侧栏 ================= -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 11.6a8.3 8.3 0 0 1-8.9 8.3 9.2 9.2 0 0 1-3.9-.9L3 21l1.9-4.9A8.3 8.3 0 0 1 12 3.3a8.3 8.3 0 0 1 9 8.3z" />
              <path d="M8.8 11.6h.01M12 11.6h.01M15.2 11.6h.01" />
            </svg>
          </span>
          <span class="brand-name">AI聊天助手</span>
        </div>
        <button class="btn btn-primary btn-new" id="btnNewTop" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>新建对话</span>
        </button>
      </div>

      <div class="sidebar-label">历史会话</div>
      <div class="session-list" id="sessionList"></div>

      <div class="sidebar-foot">
        <span class="status-dot"></span>
        <span id="serverInfo">连接中...</span>
      </div>
    </aside>

    <!-- ================= 右侧主区 ================= -->
    <main class="main">
      <!-- 默认欢迎页 -->
      <section class="welcome" id="welcomeView">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 11.6a8.3 8.3 0 0 1-8.9 8.3 9.2 9.2 0 0 1-3.9-.9L3 21l1.9-4.9A8.3 8.3 0 0 1 12 3.3a8.3 8.3 0 0 1 9 8.3z" />
            <path d="M8.8 11.6h.01M12 11.6h.01M15.2 11.6h.01" />
          </svg>
        </div>
        <p class="welcome-text">选择一个历史对话继续，或创建新的对话，开启您的AI之旅</p>
        <button class="btn btn-primary btn-lg" id="btnNewWelcome" type="button">新建对话</button>
      </section>

      <!-- 聊天页 -->
      <section class="chat" id="chatView" hidden>
        <div class="messages" id="messageList"></div>
        <div class="composer">
          <div class="composer-box">
            <textarea id="inputBox" rows="1" maxlength="2000"
                      placeholder="请输入您的消息...(Enter发送，Shift+Enter换行)"></textarea>
          </div>
          <div class="composer-side">
            <button class="btn btn-send" id="btnSend" type="button">发送</button>
            <span class="counter" id="counter">0/2000</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ================= 模型选择弹窗 ================= -->
  <div class="modal-mask" id="modelModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 class="modal-title" id="modalTitle">选择对话模型</h2>
      <p class="modal-sub">每次对话只能选择一个模型</p>
      <div class="model-grid" id="modelGrid"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btnCancel" type="button">取消</button>
        <button class="btn btn-primary" id="btnConfirm" type="button" disabled>确定</button>
      </div>
    </div>
  </div>

  <!-- ================= 删除会话确认弹窗（警告） ================= -->
  <div class="modal-mask" id="confirmModal" hidden>
    <div class="confirm" role="alertdialog" aria-modal="true"
         aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0z" />
          <path d="M12 9v4M12 17h.01" />
        </svg>
      </div>
      <h2 class="confirm-title" id="confirmTitle">删除会话</h2>
      <p class="confirm-text" id="confirmText">删除后该会话及其全部聊天记录将无法恢复，确定要删除吗？</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" id="btnConfirmCancel" type="button">取消</button>
        <button class="btn btn-danger" id="btnConfirmDelete" type="button">删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="./js/api.js"></script>
  <script src="./js/markdown.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
